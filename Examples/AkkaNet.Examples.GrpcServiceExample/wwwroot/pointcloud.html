<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Real-time Point Cloud Visualization</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			font-family: Arial, sans-serif;
			background: #000;
		}

		#container {
			position: relative;
			width: 100vw;
			height: 100vh;
		}

		#info {
			position: absolute;
			top: 10px;
			left: 10px;
			color: white;
			background: rgba(0, 0, 0, 0.7);
			padding: 15px;
			border-radius: 5px;
			font-size: 14px;
			z-index: 100;
			max-width: 300px;
		}

		#controls {
			position: absolute;
			top: 10px;
			right: 10px;
			color: white;
			background: rgba(0, 0, 0, 0.7);
			padding: 15px;
			border-radius: 5px;
			z-index: 100;
		}

		.control-group {
			margin-bottom: 10px;
		}

		label {
			display: inline-block;
			width: 100px;
			font-size: 12px;
		}

		input[type="range"] {
			width: 100px;
		}

		button {
			background: #4CAF50;
			color: white;
			border: none;
			padding: 8px 12px;
			margin: 2px;
			border-radius: 3px;
			cursor: pointer;
			font-size: 12px;
		}

			button:hover {
				background: #45a049;
			}

			button.disconnect {
				background: #f44336;
			}

				button.disconnect:hover {
					background: #da190b;
				}

		#status {
			margin-top: 10px;
			padding: 5px;
			border-radius: 3px;
		}

		.status-connected {
			background: #4CAF50;
			color: white;
		}

		.status-disconnected {
			background: #f44336;
			color: white;
		}

		.status-connecting {
			background: #ff9800;
			color: white;
		}
	</style>
</head>
<body>
	<div id="container">
		<div id="info">
			<h3>Point Cloud Visualization</h3>
			<div>Total Points: <span id="totalPoints">0</span></div>
			<div>Batches Received: <span id="batchCount">0</span></div>
			<div>Last Update: <span id="lastUpdate">Never</span></div>
			<div>FPS: <span id="fps">0</span></div>
			<div>Camera Position: <span id="cameraPos">0, 0, 0</span></div>
			<div id="status" class="status-disconnected">Disconnected</div>
		</div>

		<div id="controls">
			<h4>Controls</h4>
			<div class="control-group">
				<label>Point Size:</label>
				<input type="range" id="pointSize" min="0.1" max="5" step="0.1" value="1">
				<span id="pointSizeValue">1.0</span>
			</div>
			<div class="control-group">
				<label>Point Budget:</label>
				<input type="range" id="pointBudget" min="1000" max="100000" step="1000" value="50000">
				<span id="pointBudgetValue">50000</span>
			</div>
			<div class="control-group">
				<button id="connectBtn">Connect</button>
				<button id="disconnectBtn" class="disconnect">Disconnect</button>
			</div>
			<div class="control-group">
				<button id="clearBtn">Clear Points</button>
				<button id="resetCameraBtn">Reset Camera</button>
			</div>
			<div class="control-group">
				<button id="autoRotateBtn">Auto Rotate</button>
			</div>
		</div>
	</div>

	<!-- Three.js -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<!-- OrbitControls -->
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
	<!-- SignalR -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>

	<script>
        // Global variables
        let scene, camera, renderer, controls;
        let pointCloud = null;
        let connection = null;
        let points = [];
        let maxPoints = 50000;
        let stats = {
            totalPoints: 0,
            batchCount: 0,
            lastUpdate: null
        };
        let frameCount = 0;
        let lastTime = Date.now();
        let autoRotate = false;

        // Initialize Three.js scene
        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000011);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(10, 10, 10);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.maxPolarAngle = Math.PI;

            // Add some ambient lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            // Add directional light
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight.position.set(10, 10, 5);
            scene.add(directionalLight);

            // Add coordinate system helper
            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
        }

        // Initialize SignalR connection
        function initSignalR() {
            connection = new signalR.HubConnectionBuilder()
                .withUrl("/pointCloudHub")
                .withAutomaticReconnect()
                .build();

            // Handle point batch reception
            connection.on("ReceivePointBatch", function (batch) {
                addPointBatch(batch);
                updateStats(batch);
            });

            // Handle connection events
            connection.onreconnecting(() => {
                updateConnectionStatus("connecting", "Reconnecting...");
            });

            connection.onreconnected(() => {
                updateConnectionStatus("connected", "Connected");
                connection.invoke("JoinVisualizationRoom", "default");
            });

            connection.onclose(() => {
                updateConnectionStatus("disconnected", "Disconnected");
            });
        }

        // Connect to SignalR
        async function connect() {
            try {
                updateConnectionStatus("connecting", "Connecting...");
                await connection.start();
                updateConnectionStatus("connected", "Connected");
                await connection.invoke("JoinVisualizationRoom", "default");
                console.log("Connected to SignalR hub");
            } catch (err) {
                console.error("Connection failed: ", err);
                updateConnectionStatus("disconnected", "Connection failed");
            }
        }

        // Disconnect from SignalR
        async function disconnect() {
            try {
                if (connection) {
                    await connection.stop();
                }
                updateConnectionStatus("disconnected", "Disconnected");
            } catch (err) {
                console.error("Disconnect failed: ", err);
            }
        }

        // Add point batch to visualization
        function addPointBatch(batch) {
            console.log(`Received batch ${batch.batchId} with ${batch.points.length} points`);

            // Add new points to our collection
            for (const point of batch.points) {
                if (points.length >= maxPoints) {
                    // Remove oldest points if we exceed budget
                    points.shift();
                }
                points.push(point);
            }

            // Update point cloud
            updatePointCloud();
        }

        // Update the Three.js point cloud
        function updatePointCloud() {
            // Remove existing point cloud
            if (pointCloud) {
                scene.remove(pointCloud);
                pointCloud.geometry.dispose();
                pointCloud.material.dispose();
            }

            if (points.length === 0) return;

            // Create geometry
            const geometry = new THREE.BufferGeometry();

            // Prepare arrays
            const positions = new Float32Array(points.length * 3);
            const colors = new Float32Array(points.length * 3);

            for (let i = 0; i < points.length; i++) {
                const point = points[i];
                const i3 = i * 3;

                // Position
                positions[i3] = point.x;
                positions[i3 + 1] = point.y;
                positions[i3 + 2] = point.z;

                // Color (convert from uint to RGB)
                const color = point.color || 0xFFFFFF;
                colors[i3] = ((color >> 16) & 0xFF) / 255;      // R
                colors[i3 + 1] = ((color >> 8) & 0xFF) / 255;   // G
                colors[i3 + 2] = (color & 0xFF) / 255;          // B
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Create material
            const material = new THREE.PointsMaterial({
                size: parseFloat(document.getElementById('pointSize').value),
                vertexColors: true,
                sizeAttenuation: true
            });

            // Create point cloud
            pointCloud = new THREE.Points(geometry, material);
            scene.add(pointCloud);
        }

        // Update statistics display
        function updateStats(batch) {
            stats.totalPoints = points.length;
            stats.batchCount++;
            stats.lastUpdate = new Date();

            document.getElementById('totalPoints').textContent = stats.totalPoints.toLocaleString();
            document.getElementById('batchCount').textContent = stats.batchCount;
            document.getElementById('lastUpdate').textContent = stats.lastUpdate.toLocaleTimeString();
        }

        // Update connection status
        function updateConnectionStatus(status, message) {
            const statusElement = document.getElementById('status');
            statusElement.textContent = message;
            statusElement.className = `status-${status}`;
        }

        // Clear all points
        function clearPoints() {
            points = [];
            if (pointCloud) {
                scene.remove(pointCloud);
                pointCloud.geometry.dispose();
                pointCloud.material.dispose();
                pointCloud = null;
            }
            stats.totalPoints = 0;
            stats.batchCount = 0;
            document.getElementById('totalPoints').textContent = '0';
            document.getElementById('batchCount').textContent = '0';
        }

        // Reset camera to default position
        function resetCamera() {
            camera.position.set(10, 10, 10);
            camera.lookAt(0, 0, 0);
            controls.reset();
        }

        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Update controls
            controls.update();

            // Auto rotate if enabled
            if (autoRotate && pointCloud) {
                pointCloud.rotation.y += 0.005;
            }

            // Update camera position display
            const pos = camera.position;
            document.getElementById('cameraPos').textContent =
                `${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)}`;

            // Calculate FPS
            frameCount++;
            const now = Date.now();
            if (now - lastTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (now - lastTime));
                document.getElementById('fps').textContent = fps;
                frameCount = 0;
                lastTime = now;
            }

            // Render
            renderer.render(scene, camera);
        }

        // Initialize everything when page loads
        window.addEventListener('load', function() {
            initThreeJS();
            initSignalR();

            // Set up controls
            const pointSizeSlider = document.getElementById('pointSize');
            const pointSizeValue = document.getElementById('pointSizeValue');
            pointSizeSlider.addEventListener('input', function() {
                pointSizeValue.textContent = this.value;
                if (pointCloud) {
                    pointCloud.material.size = parseFloat(this.value);
                }
            });

            const pointBudgetSlider = document.getElementById('pointBudget');
            const pointBudgetValue = document.getElementById('pointBudgetValue');
            pointBudgetSlider.addEventListener('input', function() {
                pointBudgetValue.textContent = this.value;
                maxPoints = parseInt(this.value);
            });

            document.getElementById('connectBtn').addEventListener('click', connect);
            document.getElementById('disconnectBtn').addEventListener('click', disconnect);
            document.getElementById('clearBtn').addEventListener('click', clearPoints);
            document.getElementById('resetCameraBtn').addEventListener('click', resetCamera);

            const autoRotateBtn = document.getElementById('autoRotateBtn');
            autoRotateBtn.addEventListener('click', function() {
                autoRotate = !autoRotate;
                this.textContent = autoRotate ? 'Stop Rotation' : 'Auto Rotate';
                this.style.background = autoRotate ? '#f44336' : '#4CAF50';
            });

            // Start animation
            animate();

            // Auto-connect on load
            setTimeout(connect, 1000);
        });
	</script>
</body>
</html>
